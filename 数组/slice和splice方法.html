<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <script type="text/javascript">
       var arr=new Array(1,2,3,4,5)
       //包含strat,不包含end
       var slice = arr.slice(1,4);
       console.log(slice);
       //指定位置到尾端
       slice=arr.slice(1)
       console.log(slice);
       //指定位置到倒数第一个
       slice=arr.slice(1,-1)
       console.log(slice);

       /*
        ========================================================================
        【核心心智模型】：把索引看作元素之间的「缝隙切刀竖线」，而不是格子！
        ========================================================================
        正向标尺:   0       1       2       3       4       5 (arr.length)
                  │       │       │       │       │       │
        元素本身:   │   1   │   2   │   3   │   4   │   5   │
                  │       │       │       │       │       │
        反向标尺:  -5      -4      -3      -2      -1       0
        
        【两把刀规则】：
        - 第一刀切在 start 竖线，第二刀切在 end 竖线，两刀之间夹住的内容即为截取结果。
        - 负数索引换算：实际位置 = length + 负数。
          例如：-1 对应 5 + (-1) = 4（恰好在元素 5 的左侧竖线），因此 arr.slice(1, -1) 取出的是 [2, 3, 4]，不包含 5。
        
        【为什么是“左闭右开” [start, end)？】
        1. 长度直观：截取元素个数 = end - start（例如 4 - 1 = 3 个）。
        2. 首尾无缝拼接：arr.slice(0, 3) 与 arr.slice(3, 5) 严丝合缝对齐，不重不漏。
        3. 空结果自然：start === end 时返回 []。
        
        ========================================================================
        【三兄弟终极辨析：slice vs splice vs split】
        ========================================================================
        1. slice(start, end)  【切片】：
           - 数组 / 字符串通用，绝不改变原数据。
           - 两个参数全为切刀坐标，左闭右开提取片段。
        
        2. splice(start, deleteCount, ...items)  【剪接/手术】：
           - 【只有数组能用】！直接修改原数组！
           - 第 1 个参数是起始下标，第 2 个参数是「删除数量（切几个）」，后续参数是缝入的新元素。
           - 返回值：被剪切掉的元素组成的新数组。
        
        3. split(separator)  【劈开】：
           - 【只有字符串能用】！拿把刀按分隔符把字符串劈成数组。
        ========================================================================
       */

       // 示例：splice 剪接手术（修改原数组）
       var arr2 = ['A', 'B', 'C', 'D', 'E'];
       // 从下标 1 开始，切掉 2 个元素（'B', 'C'），并缝入 'X', 'Y'
       var deleted = arr2.splice(1, 2, 'X', 'Y');
       console.log('splice 返回被删除的片段:', deleted); // ['B', 'C']
       console.log('splice 修改后的原数组:', arr2);       // ['A', 'X', 'Y', 'D', 'E']
  </script>
</head>
<body>

</body>
</html>
